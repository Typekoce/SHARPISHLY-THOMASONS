version: '3.8'

services:
  react-native:
    container_name: maxie-react-native
    image: node:20-slim
    working_dir: /app
    volumes:
      # Mount workspace directory
      - .:/app
      # Cache node_modules in a persistent volume for faster container rebuilds
      - node_modules_cache:/app/node_modules
    ports:
      - "8081:8081"   # Metro bundler default port
      - "19000:19000" # Expo dev server port
      - "19001:19001" # Metro bundler HTTP port
      - "19002:19002" # Expo dev tools web UI
    environment:
      - REACT_NATIVE_PACKAGER_HOSTNAME=192.168.0.90 # Direct Expo QR code to maxie's LAN IP
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
    stdin_open: true
    tty: true
    command: bash

volumes:
  node_modules_cache:
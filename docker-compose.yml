services:
  # --- 1. Database (The Proven MySQL 8.0) ---
  db:
    image: mysql:8.0
    container_name: sharpishly-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sharpishly-net
    healthcheck:
      # Native MySQL health check
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- 2. The Neural Models (Ollama) ---
  ollama:
    image: ollama/ollama:latest
    container_name: sharpishly-ollama
    restart: always
    volumes:
      - ./storage/ollama:/root/.ollama
    networks:
      - sharpishly-net
    # ASYNC PULL: Pulls in background, doesn't block the stack
    entrypoint: [ "/bin/sh", "-c" ]
    command: 
      - |
        ollama serve & 
        sleep 5;
        ollama pull nomic-embed-text;
        ollama pull llama3.1;
        wait

  # --- 3. The Backend (PHP-FPM) ---
  php:
    build: .
    container_name: sharpishly-php
    restart: always
    env_file: .env
    networks:
      - sharpishly-net
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage

  # --- 4. The Web Server (Nginx Gateway) ---
  web:
    image: nginx:alpine
    container_name: sharpishly-app
    restart: always
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sharpishly-net

  # --- 5. The Neural Brain (Python Worker) ---
  ai:
    build: ./ai
    container_name: sharpishly-ai
    restart: always
    env_file: .env
    networks:
      - sharpishly-net
    volumes:
      - ./ai:/app
      - ./storage:/var/www/html/storage
    # ASYNC HANDSHAKE: It pokes the web-server until the DB is ready
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        echo "📡 AI Worker seeking Handshake..."
        until curl -s http://web/php/scaffold/migrate | grep -q "success"; do
          echo "⏳ Waiting for Database & Schema... (Retrying in 5s)"
          sleep 5
        done
        echo "✅ Connection Established. Launching Neural Engine."
        python worker.py

# --- 6. The Semantic Memory (Neo4j) ---
  neo4j:
    image: neo4j:latest
    container_name: sharpishly-graph
    restart: always
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      # Use the user and pass from your .env to set the mandatory AUTH string
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASS}
    volumes:
      - ./database/neo4j/data:/data
    networks:
      - sharpishly-net

networks:
  sharpishly-net:
    driver: bridge

volumes:
  mysql_data:
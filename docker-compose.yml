services:
  # --- THE BRAIN (PHP 8.2-FPM) ---
  # Switched to 'build' to include pdo_mysql from your Dockerfile
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sharpishly-php
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    depends_on:
      - db
    networks:
      - sharpishly-net

  # --- THE NEURAL WORKER (Background Consumer) ---
  # Uses the same image as 'php' but runs the worker script
  php-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sharpishly-worker
    restart: always
    command: ["php", "/var/www/html/web/php/src/worker.php"]
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    depends_on:
      - db
    networks:
      - sharpishly-net
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}

  # --- THE SKIN (NGINX) ---
  nginx:
    image: nginx:alpine
    container_name: sharpishly-nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - sharpishly-net

  # --- THE MEMORY (MYSQL) ---
  db:
    image: mysql:8.0
    container_name: sharpishly-db
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sharpishly-net

networks:
  sharpishly-net:
    driver: bridge

volumes:
  mysql_data:
version: '3.8'

services:
  # --- 1. The Foundation (MariaDB) ---
  db:
    image: mariadb:10.11
    container_name: sharpishly-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sharpishly-net
    healthcheck:
      # The "Handshake": PHP and AI won't move until this returns 0
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- 2. The Neural Models (Ollama) ---
  ollama:
    image: ollama/ollama:latest
    container_name: sharpishly-ollama
    restart: always
    volumes:
      - ./storage/ollama:/root/.ollama
    networks:
      - sharpishly-net
    # LATERAL THINKING: Use the entrypoint to auto-pull models on start
    entrypoint: [ "/bin/sh", "-c" ]
    command: 
      - |
        ollama serve & 
        sleep 5;
        ollama pull nomic-embed-text;
        ollama pull llama3.1;
        wait
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      retries: 5

  # --- 3. The Backend (PHP) ---
  php:
    build: .
    container_name: sharpishly-php
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sharpishly-net
    # No .sh needed: The container starts and stays ready for Nginx
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage

  # --- 4. The Neural Brain (Python) ---
  ai:
    build: ./ai
    container_name: sharpishly-ai
    restart: always
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
      php:
        condition: service_started
    networks:
      - sharpishly-net
    volumes:
      - ./ai:/app
      - ./storage:/var/www/html/storage
    # THE MASTER STROKE: Wait for Migration, then start.
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        echo "⏳ Waiting for PHP Migration..."
        until curl -s http://web/php/scaffold/migrate | grep -q "success"; do
          sleep 2
        done
        echo "✅ Schema Ready. Launching Worker..."
        python worker.py
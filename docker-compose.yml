version: '3.8'

services:
  # --- Database Service (Relational Memory) ---
  db:
    image: mysql:8.0
    container_name: sharpishly-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sharpishly-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 30s
      retries: 30
      start_period: 40s
  
  # --- Main PHP Application Service ---
  php:
    build: .
    container_name: sharpishly-php
    env_file:
      - .env
    volumes:
      - .:/var/www/html
      - ./php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - ./storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - sharpishly-net

  # --- Background Task Worker (DECOMMISSIONED PHP PROCESSING) ---
  worker:
    build: .
    container_name: sharpishly-worker
    user: "0:0"
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    # STOPPED: No longer running PHP loop. Keeping container alive for logs/debug only.
    command: tail -f /dev/null 
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - sharpishly-net

  # --- Local AI Node (Neural Processor) ---
  ollama:
    image: ollama/ollama:latest
    container_name: sharpishly-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ./storage/ollama:/root/.ollama
    networks:
    - sharpishly-net

  # --- Nginx Web Server ---
  web:
    image: nginx:alpine
    container_name: sharpishly-app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    restart: always
    networks:
      - sharpishly-net

# --- Neural Engine (The Brain) ---
  ai:
    build: 
      context: ./ai
    container_name: sharpishly-ai
    restart: always
    env_file:
      - .env
    volumes:
      - ./ai:/app
      - ./storage:/var/www/html/storage  # Critical: Shared access to Word docs
    working_dir: /app
    # Run both the API and the Worker
    command: /bin/bash -c "python main.py & python worker.py"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - sharpishly-net

  # --- Semantic Memory (The Hippocampus) ---
  neo4j:
    image: neo4j:latest
    container_name: sharpishly-graph
    restart: always
    ports:
      - "7474:7474" # Browser
      - "7687:7687" # Bolt (Used by retriever.py)
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASS}
    volumes:
      - ./database/neo4j/data:/data
    networks:
      - sharpishly-net

networks:
  sharpishly-net:
    driver: bridge

volumes:
  mysql_data:

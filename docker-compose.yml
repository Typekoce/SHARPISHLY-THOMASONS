version: '3.8'

services:
  # --- Database Service (Relational Memory) ---
  db:
    image: mysql:8.0
    container_name: sharpishly-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sharpishly-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 30s
      retries: 30
      start_period: 40s     # Important: give it time to initialize on first run
  # --- Main PHP Application Service ---
  php:
    build: .
    container_name: sharpishly-php
    env_file:
      - .env
    volumes:
      - .:/var/www/html
      - ./php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - ./storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - sharpishly-net

  # --- Background Task Worker ---
  worker:
    build: .
    container_name: sharpishly-worker
    user: "0:0"
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    command: >
      sh -c "apt-get update && apt-get install -y usbutils iproute2 util-linux pciutils python3 python3-pip 
      && php /var/www/html/web/php/src/worker.php || tail -f /dev/null"
    depends_on:
      db:
        condition: service_healthy
      # ollama:
      #   condition: service_started
    restart: always
    networks:
      - sharpishly-net
  # --- Local AI Node (Neural Processor) ---
  ollama:
    image: ollama/ollama:latest
    container_name: sharpishly-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ./storage/ollama:/root/.ollama
    networks:
    - sharpishly-net
  # --- Nginx Web Server ---
  web:
    image: nginx:alpine
    container_name: sharpishly-app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      # Point to your existing infra folder instead of the root
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    restart: always
    networks:
      - sharpishly-net
# ────────────────────────────────────────────────
# NETWORKS & VOLUMES (Must be at root level)
# ────────────────────────────────────────────────
networks:
  sharpishly-net:
    driver: bridge

volumes:
  mysql_data:
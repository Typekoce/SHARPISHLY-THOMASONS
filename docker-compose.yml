version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: sharpishly-db
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sharpishly-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sharpishly-php
    env_file: .env
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sharpishly-net

  php-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sharpishly-worker
    restart: unless-stopped
    command: ["php", "/var/www/html/web/php/src/worker.php"]
    env_file: .env
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sharpishly-net

  nginx:
    image: nginx:alpine
    container_name: sharpishly-nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - sharpishly-net

networks:
  sharpishly-net:
    driver: bridge

volumes:
  mysql_data:
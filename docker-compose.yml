name: sharpishly

services:
  # --- 1. Database (The Source of Truth) ---
  db:
    image: mysql:8.0
    container_name: sharpishly-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sharpishly-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASS}", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 40s
    mem_limit: 1G

  # --- 2. Neural Models (Ollama) ---
  ollama:
    image: ollama/ollama:latest
    container_name: sharpishly-ollama
    restart: unless-stopped
    volumes:
      - ./storage/ollama:/root/.ollama
    networks:
      - sharpishly-net
    ports:
      - "11434:11434"   # Optional: direct access if needed
    entrypoint: ["/bin/sh", "-c"]
    command: >
      ollama serve & 
      sleep 8 && 
      echo "📥 Checking/pulling models..." && 
      if [ ! -d "/root/.ollama/models/manifests/registry.ollama.ai/library/nomic-embed-text" ]; then
        ollama pull nomic-embed-text && 
        ollama pull llama3.1;
      else
        echo "✅ Models already present.";
      fi && 
      wait
    mem_limit: 8G
    cpus: "4.0"

  # --- 3. The Backend (PHP-FPM) ---
  php:
    build: .
    container_name: sharpishly-php
    restart: unless-stopped
    env_file: .env
    networks:
      - sharpishly-net
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage:rw
    depends_on:
      db:
        condition: service_healthy

  # --- 4. The Web Server (Nginx Gateway) ---
  web:
    image: nginx:alpine
    container_name: sharpishly-app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sharpishly-net
    depends_on:
      php:
        condition: service_started
      ai-api:
        condition: service_healthy

  # --- 5. Semantic Memory (Neo4j) ---
  neo4j:
    image: neo4j:latest
    container_name: sharpishly-graph
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASS}
    volumes:
      - ./database/neo4j/data:/data
    networks:
      - sharpishly-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- 6. AI API (The Messenger) ---
  ai-api:
    build: ./ai
    container_name: sharpishly-ai-api
    restart: unless-stopped
    env_file: .env
    command: uvicorn server:app --host 0.0.0.0 --port 8000
    networks:
      - sharpishly-net
    volumes:
      - ./ai:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  # --- 7. AI Worker (The Muscle) ---
  ai-worker:
    build: ./ai
    container_name: sharpishly-ai-worker
    restart: unless-stopped
    env_file: .env
    command: python worker_entry.py
    networks:
      - sharpishly-net
    volumes:
      - ./ai:/app
      - ./storage:/var/www/html/storage:rw
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-api:
        condition: service_healthy
    mem_limit: 2G
    cpus: "1.0"

  # --- 8. Redis (The Central Nervous System) ---
  redis:
    image: redis:7-alpine
    container_name: sharpishly-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - sharpishly-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  sharpishly-net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
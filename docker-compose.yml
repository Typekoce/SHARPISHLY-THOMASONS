name: sharpishly

services:
  # --- 1. The Broker (Redis) ---
  redis:
    image: redis:7-alpine
    container_name: sharpishly-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - sharpishly-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- 2. Database (MySQL 8.0) ---
  db:
    image: mysql:8.0
    container_name: sharpishly-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sharpishly-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  # --- 3. Semantic Memory (Neo4j) ---
  graph:
    image: neo4j:latest
    container_name: sharpishly-graph
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASS}
    volumes:
      - ./database/neo4j/data:/data
    networks:
      - sharpishly-net

  # --- 4. The Backend (PHP-FPM) ---
  php:
    build: .
    container_name: sharpishly-php
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage:rw
    networks:
      - sharpishly-net
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  # --- 5. The Web Server (Nginx) ---
  web:
    image: nginx:alpine
    container_name: sharpishly-app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sharpishly-net
    depends_on:
      - php

  # --- 6. Neural Models (Ollama) ---
  llm:
    image: ollama/ollama:latest
    container_name: sharpishly-ollama
    restart: unless-stopped
    volumes:
      - ./storage/ollama:/root/.ollama
    networks:
      - sharpishly-net
    # Passive Serve: Python MVC will handle model pulls via API
    command: serve

  # --- 7. AI API & Worker Pool ---
  ai:
    build: ./ai
    container_name: sharpishly-ai-api
    restart: unless-stopped
    env_file: .env
    # The PyMVC Router (FastAPI / Uvicorn)
    command: uvicorn server:app --host 0.0.0.0 --port 8000
    networks:
      - sharpishly-net

  worker:
    build: ./ai
    container_name: sharpishly-ai-worker
    restart: unless-stopped
    env_file: .env
    # Passive Idle: Container stays open as a worker pool
    # PHP/Redis will trigger actual work
    command: tail -f /dev/null
    networks:
      - sharpishly-net

networks:
  sharpishly-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
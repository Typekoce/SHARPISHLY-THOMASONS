name: sharpishly

services:
  # --- 1. The Broker (Redis) ---
  redis:
    image: redis:7-alpine
    container_name: sharpishly-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - sharpishly-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- 2. Database (MySQL 8.0) ---
  db:
    image: mysql:8.0
    container_name: sharpishly-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sharpishly-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    mem_limit: 1G

  # --- 3. Semantic Memory (Neo4j) ---
  graph:
    image: neo4j:latest
    container_name: sharpishly-graph
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASS}
    volumes:
      - ./database/neo4j/data:/data
    networks:
      - sharpishly-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 15s
      timeout: 5s
      retries: 5

  # --- 4. The Backend (PHP-FPM) ---
  php:
    build: .
    container_name: sharpishly-php
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage:rw
    networks:
      - sharpishly-net
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  # --- 5. The Web Server ---
  web:
    image: nginx:alpine
    container_name: sharpishly-app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sharpishly-net
    depends_on:
      - php

  # --- 6. Neural Models (Ollama) ---
  llm:
    image: ollama/ollama:latest
    container_name: sharpishly-ollama
    restart: unless-stopped
    volumes:
      - ./storage/ollama:/root/.ollama
    networks:
      - sharpishly-net
    # Use a persistent background serve with a wait-for-health loop
    entrypoint: ["/bin/sh", "-c"]
    command: |
      ollama serve & 
      until curl -s http://localhost:11434/api/tags > /dev/null; do 
        echo "Waiting for Ollama API..."
        sleep 3
      done
      ollama pull nomic-embed-text
      ollama pull llama3.1
      wait

  # --- 7. AI API & Worker ---
  ai:
    build: ./ai
    container_name: sharpishly-ai-api
    restart: unless-stopped
    env_file: .env
    command: uvicorn server:app --host 0.0.0.0 --port 8000
    networks:
      - sharpishly-net
    depends_on:
      redis:
        condition: service_healthy
      llm:
        condition: service_started

  worker:
    build: ./ai
    container_name: sharpishly-ai-worker
    restart: unless-stopped
    env_file: .env
    # SENIOR FIX: The shell wrapper prevents the Python connection loop crash
    # Container stays alive waiting for Redis CNS to be fully handshake-ready
    entrypoint: ["/bin/sh", "-c"]
    command: |
      until redis-cli -h redis ping | grep PONG; do
        echo "Worker waiting for Redis CNS..."
        sleep 2
      done
      echo "Redis Link Established. Booting Neural Worker..."
      python worker_entry.py
    networks:
      - sharpishly-net
    depends_on:
      redis:
        condition: service_healthy

networks:
  sharpishly-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
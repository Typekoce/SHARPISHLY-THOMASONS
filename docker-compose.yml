version: '3.8'

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sharpishly-php
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    depends_on:
      - db
    networks:
      - sharpishly-net

  php-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sharpishly-worker
    restart: always
    command: ["php", "/var/www/html/web/php/src/worker.php"]
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    depends_on:
      - db
    networks:
      - sharpishly-net

  nginx:
    image: nginx:alpine
    container_name: sharpishly-nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - sharpishly-net

  db:
    image: mysql:8.0
    container_name: sharpishly-db
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sharpishly-net

# ────────────────────────────────────────────────
# IMPORTANT: networks and volumes must be at ROOT level (same as services)
# ────────────────────────────────────────────────
networks:
  sharpishly-net:
    driver: bridge

volumes:
  mysql_data:
[www]
; Standard user for Alpine/PHP-FPM
user = www-data
group = www-data

; Listen on the standard FPM port
listen = 9000

; --- PROCESS MANAGEMENT ---
; 'dynamic' is best for balancing memory and performance
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; --- AI WORKLOAD TIMEOUTS ---
; This is critical: It prevents PHP from killing a process 
; while waiting for a long AI response. 
request_terminate_timeout = 300

; --- LOGGING ---
; Ensures errors show up in 'docker compose logs'
catch_workers_output = yes
decorate_workers_output = no

; --- ENVIRONMENT ---
; Ensures PHP can see the variables in your .env file
clear_env = no
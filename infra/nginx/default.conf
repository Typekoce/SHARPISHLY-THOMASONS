server {
    listen 80;
    server_name sharpishly.vm localhost;

    # --- THE SKIN (Frontend) ---
    # Points to your NEW web/frontend directory
    root /var/www/html/web/frontend;
    index index.html;

    location / {
        # Serve static assets (js/css), otherwise fallback to index.html for SPA
        try_files $uri $uri/ /index.html;
    }

    # --- THE BRAIN (PHP / API) ---
    # We route any request starting with /api or /php to the internal engine
    location ~ ^/(api|php) {
        # Point specifically to the NEW location of your battle-hardened index.php
        fastcgi_param SCRIPT_FILENAME /var/www/html/web/php/src/index.php;
        
        include fastcgi_params;
        fastcgi_pass php:9000;
        
        # Ensure the PHP router sees the clean URI
        fastcgi_param REQUEST_URI $request_uri;
        
        # Allow long-running neural tasks (embedding/chunking)
        fastcgi_read_timeout 300;
    }

    # Security: Prevent direct browser access to the src or storage
    location ~ ^/(web/php/src|storage)/ {
        deny all;
    }
}

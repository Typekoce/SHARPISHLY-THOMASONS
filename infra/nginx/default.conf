server {
    listen 80;
    server_name sharpishly.vm *.sharpishly.vm localhost 127.0.0.1;

    # Root for static SPA files
    root /var/www/html/web/frontend;
    index index.html;

    # Logging – using container's persistent volume
    access_log /var/www/html/storage/log/nginx_access.log;
    error_log  /var/www/html/storage/log/nginx_error.log warn;

    # ────────────────────────────────────────────────
    # 1. Frontend SPA – serve static files or fallback to index.html
    # ────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ────────────────────────────────────────────────
    # 2. PHP API – everything under /php or /api goes to the same entry point
    # ────────────────────────────────────────────────
    location ~ ^/(php|api)(/|$) {
        # Single entry point for all PHP routing
        fastcgi_param SCRIPT_FILENAME /var/www/html/web/php/src/index.php;
        fastcgi_param PATH_INFO       $fastcgi_path_info;

        include fastcgi_params;
        fastcgi_pass php:9000;

        # Preserve full original URI for router
        fastcgi_param REQUEST_URI     $request_uri;

        # Allow long-running neural/embedding tasks
        fastcgi_read_timeout  600;
        fastcgi_send_timeout  600;

        # Better buffering for SSE or streaming responses
        fastcgi_buffering     off;
        proxy_buffering       off;
    }

    # ────────────────────────────────────────────────
    # Security: block direct access to source & storage
    # ────────────────────────────────────────────────
    # location ~ ^/(web/php/src|storage|bootstrap|\.env|\.git|composer\.(json|lock)) {
    #     deny all;
    #     return 403;
    # }

    # Optional: basic security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    # ────────────────────────────────────────────────
    # To stop those "buffered to temporary file" warnings and allow the Neural Pipeline to handle larger documents
    # ────────────────────────────────────────────────
    client_max_body_size 50M;
    client_body_buffer_size 1M;

    # ────────────────────────────────────────────────
    # Python MVC DRY
    # ────────────────────────────────────────────────
    # location /pymvc/ {
    #     proxy_pass http://sharpishly-ai-api:8000/;
    #     proxy_set_header Host $host;
    # }
}

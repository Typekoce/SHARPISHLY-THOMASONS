<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-body">
            <h5 class="card-title">RAG Assistant</h5>
            <div id="chat-history" class="mb-3 p-3 border rounded" style="height: 300px; overflow-y: scroll; background: #f8f9fa;">
                <p class="text-muted">Ask a question to search your documents...</p>
            </div>
            <div class="input-group">
                <input type="text" id="rag-input" class="form-control" placeholder="Type your query...">
                <button id="rag-send" class="btn btn-primary">Ask</button>
            </div>
        </div>
    </div>
</div>

<div id="mobile">
    <div class="device-frame">
        <div class="phone-notch"></div>
        
        <div class="phone-screen">
            <!-- Status Bar -->
            <div class="status-bar">
                <span>09:41</span>
                <span>5G 🔋</span>
            </div>

            <!-- Home Screen -->
            <div id="screen-home" class="screen active" role="region" aria-label="Home Screen">
                <div class="app-grid">
                    <div class="app-icon" onclick="MobileController.openScreen('screen-sharpishly')">
                        <div class="icon-box icon-sharpishly">S</div>
                        <span class="app-name">Sharpishly</span>
                    </div>
                    <div class="app-icon" onclick="MobileController.openScreen('screen-agentic')">
                        <div class="icon-box" style="background:#6f42c1;">⚡</div>
                        <span class="app-name">Agentic</span>
                    </div>
                </div>
            </div>

            <!-- Input Screen -->
            <div id="screen-sharpishly" class="screen" role="region" aria-label="Dispatch Screen">
                <div class="app-header">
                    <button type="button" class="back-btn" aria-label="Go back to home screen" onclick="MobileController.openScreen('screen-home')">← Back</button>
                    <h3>Dispatch Agent</h3>
                </div>
                <div class="app-body">
                    <textarea id="agent-instruction" class="agent-input" placeholder="e.g. Schedule GP doctors appointment..."></textarea>
                    <button type="button" class="btn-dispatch" onclick="MobileController.generateAgent()">Convert to Agent</button>
                </div>
            </div>

            <!-- Agent Hub Screen -->
            <div id="screen-agentic" class="screen" role="region" aria-label="Agentic Hub Screen">
                <header class="window-header">
                    <h1>Agentic Hub</h1>
                    <button type="button" class="back-btn" aria-label="Go back to home screen" onclick="MobileController.openScreen('screen-home')">Home</button>
                </header>
                <div id="agentic-list" class="job-list"></div>
            </div>



            <!-- Bottom Nav Bar -->
            <div class="nav-bar">
                <div class="home-indicator" onclick="MobileController.openScreen('screen-home')"></div>
            </div>
        </div>
    </div>
</div>


<!-- Debug Overlay Target -->
<div id="debug-output" style="position: fixed; bottom: 0; left: 0; right: 0; max-height: 40vh; overflow-y: auto; background: #111; padding: 8px; z-index: 9999; font-family: monospace; font-size: 11px; color: #4ade80;"></div>

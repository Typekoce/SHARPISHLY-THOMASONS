server {
    listen 80;
    server_name sharpishly.vm;
    root /var/www/html;

    # --- THE BRAIN (MVC API HANDLER) ---
    # This block handles all requests starting with /php/
    location /php/ {
        # 1. Point to the entry file
        # Since your file is in /php/index.php, we hardcode the script path
        fastcgi_param SCRIPT_FILENAME $document_root/php/index.php;
        
        # 2. Pass the full URI (e.g., /php/csv/upload)
        # Without this, the Grok router won't see the slugs!
        fastcgi_param REQUEST_URI $request_uri;
        
        # 3. Standard FastCGI settings
        include fastcgi_params;
        fastcgi_pass php:9000;

        # 4. Persistence for Neural tasks (SSE / Long-running jobs)
        fastcgi_read_timeout 300;
        fastcgi_buffering off;
    }

    # --- THE SKIN (FALLBACK TO SPA) ---
    location / {
        root /var/www/html/website;
        try_files $uri $uri/ /index.html;
    }

    # Security: Don't let people browse your source code
    location ~ ^/php/src/ {
        deny all;
    }
}
